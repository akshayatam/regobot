[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regodit"
version = "1.0.0"
description = "Evidence-grounded AI security analyst for vendor questionnaires"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.8.0,<4",
    "prismtrace-sdk>=0.4.0,<1",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
]

[project.scripts]
regodit = "regodit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
